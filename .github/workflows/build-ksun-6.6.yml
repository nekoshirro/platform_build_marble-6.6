name: Build KernelSU-Next 6.6 (marble)

on:
  workflow_dispatch:
    inputs:
      clang_major:
        description: "Alchemist LLVM Clang major version"
        required: false
        default: "23"
        type: string

concurrency:
  group: marble-6.6-ksun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ksun-66:
    name: Build [Re]Shinomiya 6.6 (KernelSU-Next + SuSFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build KernelSU-Next 6.6 Standalone
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BUILD_CHAT_ID: ${{ secrets.TG_BUILD_CHAT_ID }}
          CLANG_MAJOR: ${{ github.event.inputs.clang_major || '23' }}
        run: |
          chmod +x ./kernelsu-next-standalone-6.6.sh
          ./kernelsu-next-standalone-6.6.sh

      - name: Upload AnyKernel3 Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shinomiya-marble-6.6-ksun
          path: |
            *.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ksun-6.6
          path: log.txt
          if-no-files-found: ignore
          retention-days: 7
